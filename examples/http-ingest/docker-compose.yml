services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: events
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d events"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports: ["5432:5432"]
  service:
    build:
      context: ../..
      dockerfile: examples/http-ingest/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/events?sslmode=disable
      LISTEN_ADDR: :8080
      BATCHING: ${BATCHING:-true}
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8080:8080"]
